# Tests automatiques, puis mise en ligne seulement s'ils sont tous réussis.
# (GitHub › Settings › Pages › Source doit être « GitHub Actions ».)
# Chaque matin, le site est aussi remis en ligne tel quel (sans refaire les tests : le code n'a pas changé)
# pour rafraîchir les prix Riftbound, Lorcana et Yu-Gi-Oh! (data/rb-prix.json, data/lc-prix.json, data/yg-prix.json, préparés par outils/ci/prix-*.mjs).
name: Tests et mise en ligne

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # aussi lancé par le robot de l'index (index.yml) après une mise à jour
  schedule:
    - cron: '41 5 * * *'

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Chromium (Playwright)
        run: |
          npm install --prefix outils/ci --no-audit --no-fund
          outils/ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Lancer les tests (tests.html)
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          node outils/ci/run-tests.mjs http://localhost:8080/tests.html

  mise-en-ligne:
    needs: tests
    # (passage du matin : tests sautés, le code en ligne est déjà celui de main)
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.tests.result == 'success' || (github.event_name == 'schedule' && needs.tests.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Préparer les fichiers du site (sans les notes ni les outils)
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.claude' --exclude '_site' \
            --exclude 'CLAUDE.md' --exclude 'docs' --exclude 'outils' --exclude 'supabase' \
            --exclude 'LISEZ-MOI.md' --exclude 'README.md' --exclude 'Lancer CollecDex.bat' ./ _site/
      - name: Prix Riftbound du jour (TCGplayer)
        run: node outils/ci/prix-riftbound.mjs _site/data/rb-prix.json
      - name: Prix Lorcana du jour (TCGplayer)
        run: node outils/ci/prix-lorcana.mjs _site/data/lc-prix.json
      - name: Prix Yu-Gi-Oh! du jour (YGOPRODeck)
        run: node outils/ci/prix-yugioh.mjs _site/data/yg-prix.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
