# Chaque lundi : remet à jour les listes des cartes Lorcana (data/lc-cartes.json, depuis LorcanaJSON), Yu-Gi-Oh! (data/yg-cartes.json, YGOPRODeck)
# Final Fantasy (data/ff-cartes.json, base officielle Square Enix + TCGplayer), Wankul (data/wk-cartes.json + visuels data/wk-img/, Wankuldex officiel) et Star Wars Unlimited (data/sw-cartes.json, base officielle FFG + TCGplayer), Dragon Ball Super (data/db-cartes.json + db-textes.json, site officiel Bandai + TCGplayer),
# ajoute les nouvelles cartes (nouvelles séries) à la base de référence des images (data/*-index),
# publie, puis lance « Tests et mise en ligne » (le site n'est mis en ligne que si les tests réussissent).
# Aussi lançable à la main : onglet Actions › Base de référence des images › Run workflow.
name: Base de référence des images

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push: # aussi quand l'outil lui-même change (pour le vérifier tout de suite)
    branches: [main]
    paths: ['outils/index-maj.*', 'outils/ci/index-maj.mjs', 'outils/ci/lorcana-cartes.mjs', 'outils/ci/yugioh-cartes.mjs', 'outils/ci/finalfantasy-cartes.mjs', 'outils/ci/wankul-cartes.mjs', 'outils/ci/starwars-cartes.mjs', 'outils/ci/dragonball-cartes.mjs', '.github/workflows/index.yml']

concurrency:
  group: index-images
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Chromium (Playwright)
        run: |
          npm install --prefix outils/ci --no-audit --no-fund
          outils/ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Liste des cartes Lorcana (LorcanaJSON)
        id: cartes
        run: |
          node outils/ci/lorcana-cartes.mjs data/lc-cartes.json
          if git diff --quiet -- data/lc-cartes.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Liste des cartes Yu-Gi-Oh! (YGOPRODeck)
        id: cartes_yg
        run: |
          node outils/ci/yugioh-cartes.mjs data/yg-cartes.json
          if git diff --quiet -- data/yg-cartes.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Liste des cartes Final Fantasy (Square Enix, TCGplayer)
        id: cartes_ff
        run: |
          node outils/ci/finalfantasy-cartes.mjs data/ff-cartes.json
          if git diff --quiet -- data/ff-cartes.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Liste des cartes Wankul (Wankuldex officiel) et visuels
        id: cartes_wk
        run: |
          node outils/ci/wankul-cartes.mjs data/wk-cartes.json data/wk-img
          if git diff --quiet -- data/wk-cartes.json data/wk-img && [ -z "$(git ls-files --others --exclude-standard data/wk-img)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Liste des cartes Star Wars Unlimited (base officielle, TCGplayer)
        id: cartes_sw
        run: |
          node outils/ci/starwars-cartes.mjs data/sw-cartes.json
          if git diff --quiet -- data/sw-cartes.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Liste des cartes Dragon Ball Super (site officiel Bandai, TCGplayer)
        id: cartes_db
        run: |
          node outils/ci/dragonball-cartes.mjs data/db-cartes.json
          if git diff --quiet -- data/db-cartes.json data/db-textes.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Ajouter les nouvelles cartes
        id: maj
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          node outils/ci/index-maj.mjs http://localhost:8080/
      - name: Publier
        if: steps.maj.outputs.changed == 'true' || steps.cartes.outputs.changed == 'true' || steps.cartes_yg.outputs.changed == 'true' || steps.cartes_ff.outputs.changed == 'true' || steps.cartes_wk.outputs.changed == 'true' || steps.cartes_sw.outputs.changed == 'true' || steps.cartes_db.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "CollecDex (robot)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ js/visual.js js/games/onepiece.js js/games/riftbound.js js/games/lorcana.js js/games/yugioh.js js/games/finalfantasy.js js/games/wankul.js js/games/starwars.js js/games/dragonball.js
          git commit -m "Nouvelles cartes : listes Lorcana, Yu-Gi-Oh!, Final Fantasy, Wankul, Star Wars Unlimited et Dragon Ball, base de référence des images (robot)"
          # numéro de version posé après avoir récupéré les derniers envois (pas de conflit sur index.html)
          git pull --rebase origin main
          sh outils/stamp.sh
          git add index.html version.json
          git commit -m "Numéro de version (robot, base de référence des images)"
          git push origin HEAD:main
          # (un envoi du robot ne relance pas les autres robots : on demande « Tests et mise en ligne » nous-mêmes)
          gh workflow run site.yml --ref main
