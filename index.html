  <style>
    .splash { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 35%, #1d1a3a, #0c0e19 70%); transition: opacity .3s; }
    .splash.out { opacity: 0; pointer-events: none; }
    /* sécurité : si l’appli ne démarre pas, l’écran disparaît quand même au bout de 10 s */
    .splash { animation: spGone 0s 10s forwards; }
    @keyframes spGone { to { opacity: 0; visibility: hidden; } }
    .splash-in { display: flex; flex-direction: column; align-items: center; gap: 14px; animation: spIn .4s .12s ease-out both; }
    .splash-logo { overflow: visible; filter: drop-shadow(0 8px 24px rgba(124,92,255,.45)); }
    .splash-logo .sp-front { transform-origin: 19.5px 14.5px; animation: spFlip 1.6s ease-in-out infinite; }
    .splash-logo .sp-back { transform-origin: 11.5px 16.5px; animation: spBob 1.6s ease-in-out infinite; }
    .splash-name { font: 700 1.6rem/1 'Fredoka', system-ui, sans-serif; color: #fff; letter-spacing: .01em; }
    .splash-name b { background: linear-gradient(90deg, #ff4fa3, #7c5cff, #34d5ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .splash-bar { width: 120px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
    .splash-bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #ff4fa3, #7c5cff, #34d5ff); animation: spBar 1.1s ease-in-out infinite; }
    @keyframes spIn { from { transform: scale(.9); } }
    @keyframes spFlip { 0%, 100% { transform: rotate(0) translateY(0); } 50% { transform: rotate(6deg) translateY(-1.5px); } }
    @keyframes spBob { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-5deg); } }
    @keyframes spBar { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @media (min-width: 761px) { .splash { display: none; } }
    @media (prefers-reduced-motion: reduce) { .splash-in, .splash-logo .sp-front, .splash-logo .sp-back, .splash-bar i { animation: none; } }
  </style>
