<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Terrain de combat Pokémon (décor du combat, dessiné pour CollecDex) -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8fe0"/><stop offset=".7" stop-color="#8fd0ff"/><stop offset="1" stop-color="#d6f1ff"/>
    </linearGradient>
    <linearGradient id="herbe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd56f"/><stop offset=".45" stop-color="#5cb84f"/><stop offset="1" stop-color="#2f8a3c"/>
    </linearGradient>
    <radialGradient id="lum" cx=".5" cy=".62" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="300" fill="url(#ciel)"/>
  <g fill="#fff" opacity=".85">
    <ellipse cx="170" cy="110" rx="90" ry="26"/><ellipse cx="220" cy="92" rx="56" ry="30"/>
    <ellipse cx="760" cy="70" rx="110" ry="24"/><ellipse cx="810" cy="52" rx="60" ry="28"/>
    <ellipse cx="520" cy="150" rx="70" ry="16"/>
  </g>
  <!-- collines et arbres au loin -->
  <path d="M0 250 Q120 180 250 230 T520 215 T780 225 T1000 205 V320 H0Z" fill="#6aa8d8" opacity=".55"/>
  <path d="M0 280 Q160 220 330 265 T660 250 T1000 255 V330 H0Z" fill="#3f9a4e"/>
  <g fill="#2c7a3d">
    <circle cx="60" cy="262" r="26"/><circle cx="95" cy="270" r="20"/><circle cx="300" cy="258" r="22"/><circle cx="330" cy="266" r="18"/>
    <circle cx="640" cy="250" r="24"/><circle cx="676" cy="258" r="18"/><circle cx="905" cy="252" r="28"/><circle cx="945" cy="262" r="20"/>
  </g>
  <!-- pelouse tondue en bandes -->
  <rect y="300" width="1000" height="700" fill="url(#herbe)"/>
  <g fill="#fff" opacity=".07">
    <rect y="330" width="1000" height="34"/><rect y="404" width="1000" height="46"/><rect y="500" width="1000" height="60"/>
    <rect y="628" width="1000" height="78"/><rect y="800" width="1000" height="96"/>
  </g>
  <rect y="300" width="1000" height="700" fill="url(#lum)"/>
  <!-- lignes du terrain (en perspective) -->
  <g fill="none" stroke="#fff" stroke-opacity=".75" stroke-linejoin="round">
    <path d="M250 345 H750 L935 960 H65 Z" stroke-width="7"/>
    <path d="M155 620 H845" stroke-width="7"/>
    <ellipse cx="500" cy="620" rx="150" ry="62" stroke-width="7"/>
    <ellipse cx="500" cy="620" rx="34" ry="14" stroke-width="7"/>
  </g>
  <!-- herbes folles -->
  <g stroke="#2c7a3d" stroke-width="4" stroke-linecap="round" opacity=".6">
    <path d="M40 980 l8 -34 M58 984 l-4 -28 M70 986 l12 -30"/><path d="M930 978 l-8 -32 M948 982 l4 -30 M962 986 l-10 -26"/>
    <path d="M30 520 l5 -18 M42 522 l-3 -16"/><path d="M968 540 l-5 -18 M980 542 l4 -14"/>
  </g>
</svg>
