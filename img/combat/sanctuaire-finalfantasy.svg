<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
  <!-- Décor des combats Final Fantasy, dessiné pour CollecDex : sanctuaire du Cristal la nuit, grand cristal flottant, colonnes, dalle de combat -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b24"/><stop offset=".5" stop-color="#14306a"/><stop offset=".8" stop-color="#2f6fb0"/><stop offset="1" stop-color="#7fc3e8"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e6f8ff"/><stop offset=".45" stop-color="#8fd8ff" stop-opacity=".55"/><stop offset="1" stop-color="#3a8fd8" stop-opacity="0"/></radialGradient>
    <linearGradient id="cry" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bfe8ff"/><stop offset=".5" stop-color="#5fb4f0"/><stop offset=".5" stop-color="#2a6fc0"/><stop offset="1" stop-color="#173f86"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4f78"/><stop offset="1" stop-color="#131c33"/></linearGradient>
    <linearGradient id="col" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55678f"/><stop offset=".5" stop-color="#8a9cc2"/><stop offset="1" stop-color="#2c3a5e"/></linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#sky)"/>
  <g fill="#e6f2ff" opacity=".85"><circle cx="90" cy="60" r="2"/><circle cx="260" cy="110" r="1.4"/><circle cx="410" cy="40" r="1.8"/><circle cx="780" cy="70" r="2"/><circle cx="930" cy="130" r="1.4"/><circle cx="1110" cy="50" r="2"/><circle cx="1010" cy="200" r="1.2"/><circle cx="170" cy="210" r="1.2"/></g>
  <!-- grand cristal flottant -->
  <circle cx="600" cy="250" r="230" fill="url(#halo)"/>
  <g transform="translate(600 250)">
    <path d="M0 -175 70 -40 0 175 -70 -40z" fill="url(#cry)" stroke="#e6f8ff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-70 -40H70M0 -175V175M0 -175-28 -40 0 175 28 -40z" fill="none" stroke="#e6f8ff" stroke-width="2" opacity=".6" stroke-linejoin="round"/>
  </g>
  <g fill="#bfe8ff" opacity=".7"><path d="M470 160l10-24 10 24-10 24z"/><path d="M720 120l8-18 8 18-8 18z"/><path d="M760 330l7-16 7 16-7 16z"/><path d="M440 340l6-14 6 14-6 14z"/></g>
  <!-- colonnes du sanctuaire -->
  <g fill="url(#col)" stroke="#0d1530" stroke-width="2">
    <rect x="80" y="210" width="60" height="290"/><rect x="230" y="250" width="50" height="250"/>
    <rect x="920" y="250" width="50" height="250"/><rect x="1060" y="210" width="60" height="290"/>
  </g>
  <g fill="#8a9cc2" stroke="#0d1530" stroke-width="2"><rect x="66" y="196" width="88" height="20"/><rect x="218" y="238" width="74" height="16"/><rect x="908" y="238" width="74" height="16"/><rect x="1046" y="196" width="88" height="20"/></g>
  <!-- sol de pierre -->
  <path d="M0 490C220 470 420 500 600 486S980 466 1200 492V700H0z" fill="url(#stone)"/>
  <!-- dalle de combat : cercle runique lumineux -->
  <g transform="translate(600 585)">
    <ellipse rx="440" ry="90" fill="#5fb4f0" opacity=".14" stroke="#9fdcff" stroke-width="3"/>
    <ellipse rx="330" ry="66" fill="none" stroke="#9fdcff" stroke-width="2" opacity=".55"/>
    <g fill="none" stroke="#9fdcff" stroke-width="2" opacity=".5"><path d="M-440 0H440M0 -90V90"/></g>
    <path d="M0 -38 22 0 0 38-22 0z" fill="#bfe8ff" stroke="#e6f8ff" stroke-width="2"/>
  </g>
</svg>
