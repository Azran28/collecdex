<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Haute mer au coucher du soleil (décor des combats One Piece, dessiné pour CollecDex) -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a55"/><stop offset=".45" stop-color="#6b4a8a"/><stop offset=".8" stop-color="#f08a5d"/><stop offset="1" stop-color="#ffc77a"/>
    </linearGradient>
    <linearGradient id="mer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f78a8"/><stop offset=".4" stop-color="#16507e"/><stop offset="1" stop-color="#082a4a"/>
    </linearGradient>
    <radialGradient id="soleil" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff2b8"/><stop offset=".35" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pont" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a32"/><stop offset="1" stop-color="#4a2c16"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="340" fill="url(#ciel)"/>
  <g fill="#fff" opacity=".18">
    <ellipse cx="200" cy="90" rx="130" ry="14"/><ellipse cx="760" cy="140" rx="160" ry="12"/><ellipse cx="480" cy="60" rx="90" ry="9"/>
  </g>
  <circle cx="640" cy="330" r="150" fill="url(#soleil)"/>
  <circle cx="640" cy="330" r="48" fill="#ffe7a0"/>
  <!-- île au loin -->
  <path d="M760 340 Q800 300 840 318 Q870 290 905 320 Q940 312 980 340Z" fill="#3b2a4a" opacity=".8"/>
  <!-- navire pirate (silhouette) -->
  <g fill="#2a1d2e" transform="translate(150 230)">
    <path d="M-10 92 H190 L170 120 H12 Z"/>
    <path d="M150 92 Q175 70 200 72 L190 92Z"/>
    <rect x="58" y="-10" width="5" height="104"/><rect x="118" y="6" width="5" height="88"/>
    <path d="M22 10 Q60 0 100 10 L96 70 Q60 62 26 70 Z" opacity=".95"/>
    <path d="M90 26 Q120 18 150 26 L147 78 Q120 72 93 78 Z" opacity=".95"/>
    <path d="M63 -10 L88 -4 L63 2 Z"/>
    <circle cx="60" cy="38" r="9" fill="#f1e2c0" opacity=".85"/>
  </g>
  <!-- mer -->
  <rect y="340" width="1000" height="660" fill="url(#mer)"/>
  <ellipse cx="640" cy="420" rx="70" ry="90" fill="#ffd27a" opacity=".16"/>
  <g fill="none" stroke="#bfe6ff" stroke-linecap="round" opacity=".45">
    <path d="M0 380 q25 -10 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" stroke-width="3"/>
    <path d="M-30 470 q35 -14 70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0" stroke-width="4"/>
    <path d="M0 590 q45 -18 90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0" stroke-width="5"/>
    <path d="M-50 730 q60 -22 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0" stroke-width="6"/>
  </g>
  <!-- pont du navire (ton côté) -->
  <path d="M0 880 Q500 850 1000 880 V1000 H0Z" fill="url(#pont)"/>
  <g stroke="#2e1a0c" stroke-width="3" opacity=".6">
    <path d="M0 912 Q500 884 1000 912"/><path d="M0 948 Q500 922 1000 948"/><path d="M0 984 Q500 960 1000 984"/>
    <path d="M200 868 L170 1000 M420 860 L410 1000 M600 860 L610 1000 M800 866 L830 1000"/>
  </g>
  <path d="M0 880 Q500 850 1000 880" stroke="#c48a52" stroke-width="10" fill="none"/>
</svg>
