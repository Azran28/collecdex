<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
  <!-- Décor des combats Star Wars Unlimited, dessiné pour CollecDex : hangar ouvert sur l'espace, planète, étoiles, sol métallique -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#02030a"/><stop offset=".6" stop-color="#0b1230"/><stop offset="1" stop-color="#1b2552"/></linearGradient>
    <radialGradient id="pl" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#ffd59a"/><stop offset=".45" stop-color="#d88a3c"/><stop offset="1" stop-color="#5a2a10"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe81f" stop-opacity=".35"/><stop offset="1" stop-color="#ffe81f" stop-opacity="0"/></radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a1d26"/><stop offset=".5" stop-color="#3a3f4d"/><stop offset="1" stop-color="#1a1d26"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a505e"/><stop offset="1" stop-color="#14161c"/></linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#sky)"/>
  <g fill="#fff"><circle cx="120" cy="80" r="1.6"/><circle cx="300" cy="150" r="1.2"/><circle cx="460" cy="60" r="1.8"/><circle cx="640" cy="120" r="1.1"/><circle cx="820" cy="70" r="1.5"/><circle cx="980" cy="160" r="1.3"/><circle cx="1100" cy="90" r="1.7"/><circle cx="220" cy="260" r="1"/><circle cx="560" cy="230" r="1.4"/><circle cx="760" cy="280" r="1"/><circle cx="1040" cy="250" r="1.2"/><circle cx="380" cy="320" r="1.1"/></g>
  <circle cx="860" cy="230" r="190" fill="url(#glow)"/>
  <circle cx="860" cy="230" r="110" fill="url(#pl)"/>
  <ellipse cx="860" cy="230" rx="175" ry="26" fill="none" stroke="#e7c08a" stroke-width="5" opacity=".55" transform="rotate(-14 860 230)"/>
  <!-- chasseurs au loin -->
  <g fill="none" stroke="#c9d3e8" stroke-width="3" opacity=".8">
    <g transform="translate(330 210)"><circle r="7"/><path d="M-16 -12V12M16 -12V12M-16 0H-7M7 0H16"/></g>
    <g transform="translate(420 260) scale(.7)"><circle r="7"/><path d="M-16 -12V12M16 -12V12M-16 0H-7M7 0H16"/></g>
  </g>
  <path d="M300 205 160 190M418 258 330 250" stroke="#ff3b3b" stroke-width="3" opacity=".7"/>
  <!-- bord du hangar -->
  <path d="M0 0H150L210 470H0Z M1200 0H1050L990 470H1200Z" fill="url(#wall)"/>
  <path d="M0 0H1200V40H0Z" fill="#20232d"/>
  <g fill="#ffe81f" opacity=".75"><rect x="40" y="90" width="60" height="6"/><rect x="50" y="200" width="70" height="6"/><rect x="62" y="310" width="78" height="6"/><rect x="1100" y="90" width="60" height="6"/><rect x="1080" y="200" width="70" height="6"/><rect x="1060" y="310" width="78" height="6"/></g>
  <path d="M0 470H1200V700H0Z" fill="url(#floor)"/>
  <g stroke="#6a7182" stroke-width="2" opacity=".6"><path d="M0 520H1200M0 590H1200M600 470V700M300 470 160 700M900 470 1040 700"/></g>
  <ellipse cx="600" cy="560" rx="330" ry="46" fill="none" stroke="#ffe81f" stroke-width="4" opacity=".45"/>
</svg>
