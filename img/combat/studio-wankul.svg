<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
  <!-- Décor des combats Wankul, dessiné pour CollecDex : plateau de stream le soir, écrans, lumières néon, deux fauteuils, tapis de jeu bleu -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1033"/><stop offset=".65" stop-color="#1b2a8c"/><stop offset="1" stop-color="#2a49b8"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16287a"/><stop offset="1" stop-color="#070c2a"/></linearGradient>
    <radialGradient id="spot" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8fb2ff" stop-opacity=".55"/><stop offset="1" stop-color="#8fb2ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#a35bff"/></linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#wall)"/>
  <g opacity=".18" fill="#fff"><circle cx="90" cy="80" r="26"/><circle cx="260" cy="150" r="18"/><circle cx="980" cy="90" r="30"/><circle cx="1110" cy="200" r="16"/><circle cx="640" cy="60" r="14"/></g>
  <!-- néons -->
  <path d="M60 300h260M880 300h260" stroke="#ff6ec4" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <path d="M60 320h200M940 320h200" stroke="#5be3ff" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <!-- écrans -->
  <g transform="translate(400 90)">
    <rect width="400" height="230" rx="16" fill="#0b0f2a" stroke="#c8d3ff" stroke-width="6"/>
    <rect x="16" y="16" width="368" height="198" rx="8" fill="url(#scr)" opacity=".85"/>
    <rect x="70" y="80" width="260" height="60" rx="12" fill="#f4efe6"/>
    <circle cx="160" cy="70" r="22" fill="#2a49b8"/><circle cx="235" cy="66" r="24" fill="#2a49b8"/>
    <rect x="180" y="230" width="40" height="40" fill="#0b0f2a"/>
  </g>
  <rect x="140" y="140" width="190" height="120" rx="10" fill="#0b0f2a" stroke="#c8d3ff" stroke-width="4"/><rect x="152" y="152" width="166" height="96" rx="6" fill="#3a5bd9" opacity=".8"/>
  <rect x="870" y="140" width="190" height="120" rx="10" fill="#0b0f2a" stroke="#c8d3ff" stroke-width="4"/><rect x="882" y="152" width="166" height="96" rx="6" fill="#8a4bd9" opacity=".8"/>
  <ellipse cx="600" cy="560" rx="560" ry="220" fill="url(#spot)"/>
  <!-- sol et tapis de jeu -->
  <path d="M0 470h1200v230H0z" fill="url(#floor)"/>
  <path d="M260 520h680l90 150H170z" fill="#2a49b8" stroke="#f4efe6" stroke-width="5" opacity=".9"/>
  <path d="M420 560h360M380 610h440" stroke="#f4efe6" stroke-width="3" opacity=".35"/>
  <!-- fauteuils -->
  <g fill="#0b0f2a" stroke="#5b8cff" stroke-width="4"><path d="M120 470c0-80 20-120 70-120s70 40 70 120v40H120z"/><path d="M940 470c0-80 20-120 70-120s70 40 70 120v40H940z"/></g>
</svg>
